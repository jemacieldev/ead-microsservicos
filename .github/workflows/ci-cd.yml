# Workflow de CI/CD da plataforma EAD (microsserviços com DDD + API Gateway)
#
# Fluxo:  push/PR  ->  [1] Lint + testes de cada serviço (em paralelo)
#                  ->  [2] Teste de integração com Docker Compose (todos juntos)
#                  ->  [3] Publicação das imagens Docker no GitHub Container Registry
#                          (somente quando o código chega na branch main)
name: CI/CD - Plataforma EAD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

# Se um novo push chegar, cancela a execução antiga da mesma branch (economiza tempo)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------- [1] CI
  testes:
    name: Lint e testes (${{ matrix.servico }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [cursos, alunos, avaliacoes, gateway]
    defaults:
      run:
        working-directory: services/${{ matrix.servico }}
    steps:
      - name: Baixar o código (checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.12 (com cache de dependências)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.servico }}/requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Análise estática (ruff)
        run: ruff check .

      - name: Testes unitários (pytest)
        run: pytest -v --junitxml=relatorio-testes.xml

      - name: Guardar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-${{ matrix.servico }}
          path: services/${{ matrix.servico }}/relatorio-testes.xml

  # ------------------------------------------------- [2] Integração (staging)
  integracao:
    name: Teste de integração (Docker Compose)
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código (checkout)
        uses: actions/checkout@v4

      - name: Subir os 4 containers
        run: docker compose up -d --build

      - name: Aguardar o API Gateway ficar saudável
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "O gateway não ficou saudável a tempo" && exit 1

      - name: Testar as rotas pelo API Gateway
        run: |
          curl -sf http://localhost:8000/api/cursos
          curl -sf http://localhost:8000/api/painel/1 | tee painel.json
          grep -q '"situacao":"aprovado"' painel.json

      - name: Mostrar logs se algo falhar
        if: failure()
        run: docker compose logs

      - name: Derrubar os containers
        if: always()
        run: docker compose down

  # ------------------------------------------------------------- [3] CD
  publicar:
    name: Publicar imagem (${{ matrix.servico }})
    needs: integracao
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servico: [cursos, alunos, avaliacoes, gateway]
    steps:
      - name: Baixar o código (checkout)
        uses: actions/checkout@v4

      - name: Nome do dono do repositório em minúsculas
        run: echo "DONO=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.servico }}
          push: true
          tags: |
            ghcr.io/${{ env.DONO }}/ead-${{ matrix.servico }}:latest
            ghcr.io/${{ env.DONO }}/ead-${{ matrix.servico }}:${{ github.sha }}
